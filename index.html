<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <style>
    .navbar {
     background-color: white;
     padding: 10px 20px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
 }
 
 .navbar #logo {
     height: 90px;
     width: 90px;
 }
 
 .nav-links {
     list-style: none;
     display: flex;
     gap: 20px;
 }
 
 .nav-links a {
     color: black;
     text-decoration: none;
     font-weight: bold;
 }
 body {
    background-image: url(https://obmontessori.orangeapps.ph/landing/obmontessori/images/FV%20Facade.jpg);
    background-size: cover;
    background-repeat: no-repeat;
 }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" alt="" class="img-fluid rounded-circle" style="height: 60px; width: 60px;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Enroll</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>
      <br>
        <a class="btn btn-primary rounded-5 p-3" type="button" href="https://obmontessori.orangeapps.ph/landing/obmontessori/">My Portal</a>
    </div>
  </div>
</nav>
<div class="container" style="max-width: 90%;">
<div class="row gap-3 justify-content-center">
    <div class="col-lg-6">
        <label for="FN" class="form-label">First Name (required)</label>
        <input type="text" class="form-control rounded-5" id="FN" name="FN" required>
    </div>
    <div class="col-lg-6">
        <label for="LN" class="form-label">Last Name (required)</label>
        <input type="text" class="form-control rounded-5" id="LN" name="LN" required>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-lg-2">
        <label for="BD" class="form-label">Birth Date</label>
        <input type="date" class="form-control rounded-5" id="BD" name="BD" required>
    </div>
    <div class="col-lg-2">
        <label for="GN" class="form-label">Gender</label>
        <select type="radio" class="form-select rounded-5" id="GN" name="GN" required>
                    <option value="F">Female</option>
                    <option value="M">Male</option>
                </select>
    </div>
    <div class="col-lg-2">
        <label for="GN" class="form-label">Grade Level</label>
        <select type="radio" class="form-select rounded-5" id="GN" name="GN" required>
                    <option value="C">Casa</option>
                    <option value="AC">Advanced Casa</option>
                    <option value="1">Grade 1</option>
                    <option value="2">Grade 2</option>
                    <option value="3">Grade 3</option>
                    <option value="4">Grade 4</option>
                    <option value="5">Grade 5</option>
                    <option value="6">Grade 6</option>
                    <option value="7">Grade 7</option>
                    <option value="8">Grade 8</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <label for="EM" class="form-label">Email Address</label>
        <input type="email" class="form-control rounded-5" id="EM" name="EM" required>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <label for="CN" class="form-label">Contact Number</label>
        <input type="number" class="form-control rounded-5" id="CN" name="CN" required>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <label for="ML" class="form-label">Mode of Learning</label>
        <select type="radio" class="form-control rounded-5" id="ML" name="ML" required>
                    <option value="F2F">Face-to-Face</option>
                    <option value="O">Online</option>
                    <option value="H">Hybrid</option>
        </select>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-lg-6">    
        <input type="radio" id="ag" name="ag">
                <label for="ag">I confirm that the information provided is true and complete.</label>
    </div>
</div>
</div>
</body>
</html>
